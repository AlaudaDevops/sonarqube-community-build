apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  name: sonarqube-ce-test-pg-registry
  annotations:
    pipelinesascode.tekton.dev/on-comment: "^/build-pg-test-image$"
    pipelinesascode.tekton.dev/on-cel-expression: |-
      event == "pull_request" &&
      target_branch == "alauda-2026.1.0" &&
      (
        ".tekton/pr-build-pg-test-image.yaml".pathChanged() ||
        "testing/**".pathChanged()
      )
    pipelinesascode.tekton.dev/cancel-in-progress: "true"
    pipelinesascode.tekton.dev/max-keep-runs: "3"
spec:
  pipelineRef:
    resolver: hub
    params:
      - name: catalog
        value: alauda
      - name: type
        value: tekton
      - name: kind
        value: pipeline
      - name: name
        value: clone-image-build-test-scan
      - name: version
        value: "0.2"

  params:
    - name: git-url
      value: "{{ repo_url }}"
    - name: git-revision
      value: "{{ source_branch }}"
    - name: git-commit
      value: "{{ revision }}"
    - name: pull-request-number
      value: "{{ pull_request_number }}"

    - name: image-repository
      value: build-harbor.alauda.cn/devops/sonarqube-ce-test
    - name: platforms
      value:
        - linux/amd64
    - name: ignore-gitversion-tag
      value: "false"
    - name: reuse-artifact
      value: "false"
    - name: ignore-trivy-scan
      value: "true"
    - name: containerfile-path
      value: testing/Containerfile
    - name: context
      value: .
    - name: build-extra-args
      value:
        - --build-arg
        - GOLANG_IMAGE=hub-mirrors.alauda.cn/library/golang:1.25.5-bookworm
        - --build-arg
        - TEST_BASE_IMAGE=build-harbor.alauda.cn/devops/sonarqube-ce-test-base:latest
        - --build-arg
        - GOPROXY=https://build-nexus.alauda.cn/repository/golang/,direct
        - --build-arg
        - PLAYWRIGHT_DOWNLOAD_HOST=https://registry.npmmirror.com/-/binary/playwright
    - name: file-list-for-commit-sha
      value:
        - testing
    - name: test-script
      value: |-
        test -x /app/lynx-entrypoint.sh
        grep -Fq 'registry-dev.alauda.io' /app/testing/testdata/resources/pg-postgresql.yaml
        grep -Fq 'registry-dev.alauda.io' /app/testing/testdata/resources/job-init-sonar-db.yaml

  workspaces:
    - name: source
      volumeClaimTemplate:
        spec:
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 2Gi
          storageClassName: topolvm
    - name: dockerconfig
      secret:
        secretName: build-harbor.kauto.docfj
    - name: basic-auth
      secret:
        secretName: "{{ git_auth_secret }}"
    - name: gitversion-config
      configMap:
        name: gitversion-config

  taskRunTemplate:
    podTemplate:
      securityContext:
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
