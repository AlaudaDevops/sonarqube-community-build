apiVersion: v2
name: sonarqube
description: SonarQube is a self-managed, automatic code review tool that systematically helps you deliver clean code. As a core element of our Sonar solution, SonarQube integrates into your existing workflow and detects issues in your code to help you perform continuous code inspections of your projects. The tool analyses 30+ different programming languages and integrates into your CI pipeline and DevOps platform to ensure that your code meets high-quality standards. SonarQube® and SonarSource® are registered trademarks of SonarSource S.A. Alauda is an independent vendor. This product is not affiliated with, endorsed by, or sponsored by SonarSource S.A. All trademarks are the property of their respective owners and are used here for identification purposes only.
type: application
version: 2026.1.0
appVersion: 2026.1.0

# add alauda chart settings
community:
  enabled: true
keywords:
  - coverage
  - security
  - code
  - quality
home: https://www.sonarqube.org/
# No icon URL: the upstream one is a SonarSource logo hosted by SonarSource.
sources:
  - https://github.com/SonarSource/helm-chart-sonarqube/tree/master/charts/sonarqube
  - https://github.com/SonarSource/docker-sonarqube
  - https://github.com/SonarSource/sonarqube
kubeVersion: ">= 1.24.0-0"
maintainers:
  - name: Alauda DevOps
annotations:
  trademark-notice: |
    SonarQube® and SonarSource® are registered trademarks of SonarSource S.A.
    Alauda is an independent vendor. This product is not affiliated with, endorsed by, or sponsored by SonarSource S.A. All trademarks are the property of their respective owners and are used here for identification purposes only.
  artifacthub.io/links: |
    - name: support
      url: https://community.sonarsource.com/
    - name: Chart Source
      url: https://github.com/SonarSource/helm-chart-sonarqube/tree/master/charts/sonarqube
  artifacthub.io/changes: |
    - kind: changed
      description: "Upgrade SonarQube Server to 2026.1.0"
    - kind: changed
      description: "Upgrade Chart's version to 2026.1.0"
    - kind: changed
      description: "Upgrade SonarQube Community Build to 26.1.0.118079"
    - kind: removed
      description: "Remove PostgreSQL embedded chart dependency and related settings"
    - kind: added
      description: "Support Kubernetes v1.35"
    - kind: added
      description: "Support RedHat Openshift v4.20"
    - kind: security
      description: "Update ingress-nginx subchart to v4.14.1"
    - kind: deprecated
      description: "Deprecate the ingress-nginx dependency"
  artifacthub.io/containsSecurityUpdates: "false"
  artifacthub.io/images: |
    - name: sonarqube-community
      image: sonarqube:26.1.0.118079-community
    - name: sonarqube-developer
      image: sonarqube:2026.1.0-developer
    - name: sonarqube-enterprise
      image: sonarqube:2026.1.0-enterprise
  charts.openshift.io/name: sonarqube
dependencies:
  - name: ingress-nginx
    version: 4.14.1
    repository: https://kubernetes.github.io/ingress-nginx
    condition: nginx.enabled,ingress-nginx.enabled
