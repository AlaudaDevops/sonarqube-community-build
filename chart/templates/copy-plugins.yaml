apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ template "sonarqube.fullname" . }}-copy-plugins
  labels: {{- include "sonarqube.labels" . | nindent 4 }}
data:
  copy_plugins.sh: |-
      #!/bin/bash
      set -e
      # Load environment variables from mounted config files (STIG compliant)
      load_env_from_directory() {
          local dir="$1"
          local should_delete="$2"
          if [ -d "$dir" ]; then
              for file in "$dir"/*; do
                  if [ -f "$file" ]; then
                      local var_name
                      var_name=$(basename "$file")
                      export "$var_name"="$(cat "$file")"
                      if [ "$should_delete" = "true" ]; then
                          rm -f "$file"
                      fi
                  fi
              done
          fi
      }

      # Load JDBC config (URL, username). Source is a ConfigMap, not a Secret,
      # so keep files on disk: init containers do not re-run on container restart,
      # and deleting them here would leave the wrapper unable to re-export the env
      # vars on the next restart, silently falling back to embedded H2.
      load_env_from_directory /etc/sonar/config/jdbc false

      # Load extra secrets and delete files after reading
      if [ -d "/etc/sonar/config/secrets" ]; then
          for secret_dir in /etc/sonar/config/secrets/*/; do
              load_env_from_directory "$secret_dir" true
          done
          rmdir /etc/sonar/config/secrets/*/ 2>/dev/null || true
      fi

      # Load extra configmaps (non-sensitive, keep files)
      if [ -d "/etc/sonar/config/configmaps" ]; then
          for configmap_dir in /etc/sonar/config/configmaps/*/; do
              load_env_from_directory "$configmap_dir" false
          done
      fi
      
      # Set JDBC password from projected volume
      if [ -f /run/postgresql/secret/SONAR_JDBC_PASSWORD ]; then
        export SONAR_JDBC_PASSWORD=$(cat /run/postgresql/secret/SONAR_JDBC_PASSWORD)
      fi

      # Set monitoring passcode from mounted secret volume
      if [ -f /run/secrets/monitoring-passcode/SONAR_WEB_SYSTEMPASSCODE ]; then
        export SONAR_WEB_SYSTEMPASSCODE=$(cat /run/secrets/monitoring-passcode/SONAR_WEB_SYSTEMPASSCODE)
      fi

      {{- if .Values.plugins.deleteDefaultPlugins }}
      rm -f /opt/sonarqube/extensions/plugins/*.jar
      {{- end }}
      {{- if .Values.plugins.useDefaultPluginsPackage }}
      for f in /opt/sonarqube/extensions/plugins/tmp/*.jar
      do
        file=${f##*/} && file=${file%-[0-9]*}
        for original in /opt/sonarqube/extensions/plugins/*.jar
        do
          originalfile=${original##*/} && originalfile=${originalfile%-[0-9]*}
          if [ "$originalfile" = "$file" ]; then
            rm -f "$original"
          fi
        done
      done
      cp /opt/sonarqube/extensions/plugins/tmp/*.jar /opt/sonarqube/extensions/plugins/
      {{- end }}
      # start SonarQube
      /opt/sonarqube/docker/entrypoint.sh
