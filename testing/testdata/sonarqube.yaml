apiVersion: operator.alaudadevops.io/v1alpha1
kind: Sonarqube
metadata:
  name: sonarqube-test
spec:
  helmValues:
    # Analyzers are imported by scripts/import-official-plugins.sh. Set explicitly because the
    # operator under test may bundle a chart that still defaults to deleting them on start.
    plugins:
      deleteDefaultPlugins: false
    global:
      registry:
        address: <config.{{.registry.test | default "registry-dev.alauda.io"}}>
    postgresql:
      enabled: false
    jdbcOverwrite:
      enable: true
      jdbcSecretName: postgres-password
      jdbcUrl: jdbc:postgresql://pg-postgresql.<namespace>.svc.cluster.local:5432/sonardb?socketTimeout=1500
      jdbcUsername: postgres
    prometheusExporter:
      enabled: false
    service:
      name: sonarqube
      type: NodePort
      nodePort: <nodeport.http>
    account:
      adminPasswordSecretName: sonarqube-root-password
    persistence:
      enabled: true
      existingClaim: sonarqube-pvc
